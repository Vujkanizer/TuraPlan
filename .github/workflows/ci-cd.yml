name: CI/CD

# Cevovod se sproži ob pull requestu v main in ob pushu na main.
# lint, build in test tečejo vzporedno. Namestitev pride v naslednjem koraku.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Lint backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ruff check .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gradnja frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Preverjanje backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check

      # Django nima koraka prevajanja. V paket gre koda, ki jo namestitev prenese, brez predpomnilnika in baze.
      - name: Paket backenda
        working-directory: backend
        run: |
          mkdir -p build
          tar \
            --exclude=build \
            --exclude=__pycache__ \
            --exclude=.venv \
            --exclude=db.sqlite3 \
            --exclude=.pytest_cache \
            --exclude=.coverage \
            --exclude=coverage.xml \
            -cf - . | tar -xf - -C build

      - name: Artefakt frontenda
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Artefakt backenda
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testi frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Testi backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest --cov=users --cov=tours --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Poročilo o pokritosti
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            frontend/coverage
            backend/coverage.xml
          if-no-files-found: error
