name: CI/CD

# Cevovod se sproži ob pull requestu v main in ob pushu na main.
# lint, build in test tečejo vzporedno.
# deploy teče samo ob pushu na main, in samo če so lint, build in test uspešni.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Lint backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ruff check .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # VITE_API_URL se vgradi v paket. Deploy frontenda zato ne sme ponovno zagnati vite build.
      - name: Gradnja frontenda
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            VITE_API_URL="https://turaplan.onrender.com/api"
          fi
          export VITE_API_URL
          npm ci
          npm run build
          cp vercel.json dist/vercel.json

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Preverjanje backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py check

      # Django nima koraka prevajanja. V paket gre koda, ki jo namestitev prenese, brez predpomnilnika in baze.
      - name: Paket backenda
        working-directory: backend
        run: |
          mkdir -p build
          tar \
            --exclude=build \
            --exclude=__pycache__ \
            --exclude=.venv \
            --exclude=db.sqlite3 \
            --exclude=.pytest_cache \
            --exclude=.coverage \
            --exclude=coverage.xml \
            -cf - . | tar -xf - -C build

      - name: Artefakt frontenda
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Artefakt backenda
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build
          if-no-files-found: error

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Testi frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Testi backenda
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest --cov=users --cov=tours --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Poročilo o pokritosti
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            frontend/coverage
            backend/coverage.xml
          if-no-files-found: error

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tura-plan.vercel.app
    steps:
      # Vercel projekt ima korensko mapo frontend, zato mora dist ležati v frontend-dist/frontend.
      - name: Artefakt frontenda
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/frontend

      - name: Artefakt backenda
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend-build

      # --prebuilt preskoči vite build. Vercel dobi že zgrajene datoteke.
      - name: Namestitev frontenda na Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel
          mkdir -p /tmp/static
          cp -a frontend-dist/frontend/. /tmp/static/
          mkdir -p frontend-dist/frontend/.vercel/output
          mv /tmp/static frontend-dist/frontend/.vercel/output/static
          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > frontend-dist/frontend/.vercel/output/config.json
          vercel deploy frontend-dist --prebuilt --prod --yes --token "$VERCEL_TOKEN"

      # Render nima nalaganja zip paketa. Hook namesti isti commit, ki je ustvaril artefakt.
      # V tem jobu ni pip install in ni npm run build.
      - name: Namestitev backenda na Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -f backend-build/manage.py
          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
